version: "1.0"
info:
  model: int-scaffold
packages:
- name: SesmProject
  gitServerName: Adapters
  gitUrl: https://github.com/Sephali-Smrutisikha-IBM-1
  gitUsername: Sephali-Smrutisikha-IBM-1
  gitBranch: main
- name: WmKafkaAdapter
  version: 9.6.0.0.26
  wpmServer: https://packages.webmethods.io
  wpmRegistry: licensed
  wpmVersion: latest
security:
- name: SesmProject
  allowedServices: []
  javaServiceSetting: PROJECT
  keystores:
  - alias: Kafka_SSL_Truststore
    type: truststore
    path: /opt/webmethods/IntegrationServer/bin/../transientConfig/customSecurityStores/ts_Kafka_SSL_Truststore.p12
    contents: "{AES}"
    configContents: "{AES}"
    password: "{AES}LNQe56OwN8DojTq6W4ALOmmK1wuN3U1rA1B0VhuZoUw="
    format: PKCS12
    provider: SUN
